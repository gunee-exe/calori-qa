# This file configures the analyzer, which statically analyzes Dart code to
# check for errors, warnings, and lints.
#
# Run from the command line with `flutter analyze`.

include: package:flutter_lints/flutter.yaml

# riverpod_lint 3.x runs on Dart's native analysis-server plugin system, not
# custom_lint. It is installed from here, not from dev_dependencies.
plugins:
  riverpod_lint: ^3.1.8

analyzer:
  # Generated code is not ours to lint. drift_dev, freezed, riverpod_generator
  # and json_serializable all emit files that would otherwise flood `flutter
  # analyze` with warnings we cannot act on.
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/*.drift.dart"
    - build/**
    - android/**
    - ios/**

  language:
    strict-casts: true
    strict-raw-types: true

  errors:
    # Missing a `default` or a case in a switch over a sealed class is a real
    # bug here: GoalResult is sealed precisely so the compiler enforces that
    # every refusal and adjustment is handled in the UI.
    non_exhaustive_switch_statement: error
    non_exhaustive_switch_expression: error

linter:
  rules:
    # Money and correctness.
    - avoid_print
    - prefer_const_constructors
    - prefer_const_declarations

    # Async correctness around the camera, the Worker call and drift streams.
    - unawaited_futures
    - avoid_slow_async_io
    - cancel_subscriptions
    - close_sinks

# Additional information about this file can be found at
# https://dart.dev/guides/language/analysis-options
