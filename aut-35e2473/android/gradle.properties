org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Kotlin incremental compilation is disabled because this project lives on H:
# while the Dart pub cache lives on C:. Kotlin's RelocatableFileToPathConverter
# computes each source path relative to the build root, and File.relativeTo()
# throws IllegalArgumentException across Windows drive roots:
#
#   this and base files have different roots:
#     C:\...\Pub\Cache\...\image_picker_android\...\Messages.kt
#     H:\flutter_apps\caltracker\android
#
# Any plugin carrying Kotlin sources fails ':compileReleaseKotlin' without this.
# The alternative is relocating PUB_CACHE onto the same drive as the project.
kotlin.incremental=false
